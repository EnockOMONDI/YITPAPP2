<form id="lessonForm" method="post" action="{% url 'users:instructor_get_lesson_form' lesson.id %}">
    {% csrf_token %}
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="fw-bold mb-0">Edit Lesson: {{ lesson.title }}</h5>
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-save me-2"></i>Save Changes
        </button>
    </div>

    <div class="mb-3">
        <label class="form-label fw-bold">Title</label>
        {{ form.title }}
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Content Type</label>
            {{ form.content_type }}
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Duration (mins)</label>
            {{ form.estimated_duration }}
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label fw-bold">Content</label>
        {{ form.content }}
    </div>

    <div class="mb-3">
        <label class="form-label fw-bold">Video URL</label>
        {{ form.video_url }}
    </div>

    <div class="mb-3">
        <label class="form-label fw-bold">Document URL</label>
        {{ form.document_url }}
    </div>

    <div class="mb-3">
        <label class="form-label fw-bold">Audio URL</label>
        {{ form.audio_url }}
    </div>

    <div class="mb-3">
        <div class="form-check form-switch">
            {{ form.is_published }}
            <label class="form-check-label">Publish Lesson</label>
        </div>
        <div class="form-check form-switch">
            {{ form.is_mandatory }}
            <label class="form-check-label">Mandatory Completion</label>
        </div>
    </div>
</form>
