<div class="yitp-role-nav">

                <i class="fas fa-crown text-warning"></i>
                Superuser Controls
            </div>
            <div class="yitp-role-tabs">

                <a href="{% url 'users:superuser_dashboard' %}" class="{% if current.url_name == 'superuser_dashboard' %}active{% endif %}">HQ Dashboard</a>

            </div>
            <div class="yitp-role-actions">
                <a href="{% url 'users:export_users_csv' %}"><i class="fas fa-file-export me-1"></i>Export Users</a>
                <a href="{% url 'users:export_payments_csv' %}"><i class="fas fa-file-invoice-dollar me-1"></i>Export Payments</a>
