services:
  - type: web
    name: yitp-lms
    env: python
    branch: 2026mtesting
    buildCommand: ./build.sh
    startCommand: gunicorn blog.wsgi:application
    envVars:
      # Django Configuration
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "www.youthimpactglobal.com,youthimpactglobal.com,*.youthimpactglobal.com,yitpapp2.onrender.com,*.onrender.com"

      # Supabase PostgreSQL Database Configuration
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false

      # Email Configuration (Mailtrap API - MIGRATED FROM GMAIL SMTP)
      - key: MAILTRAP_API_TOKEN
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

      # M-Pesa API Configuration
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_ENVIRONMENT
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false

      # PayPal API Configuration - LIVE PRODUCTION
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false

      # Site Configuration
      - key: SITE_URL
        value: "https://www.youthimpactglobal.com"

      # Admin Configuration
      - key: ADMIN_EMAIL
        sync: false

      # TinyMCE Configuration
      - key: TINYMCE_API_KEY
        sync: false

      # Static Files Configuration
      - key: STATIC_URL
        value: "/static/"
      - key: STATIC_ROOT
        value: "staticfiles"
